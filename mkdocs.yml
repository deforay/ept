site_name: ePT Documentation
site_description: Documentation and training curriculum for the ePT Proficiency Testing system
site_url: https://deforay.github.io/ept/
repo_url: https://github.com/deforay/ept
repo_name: deforay/ept

docs_dir: docs

# In-app help topics are delivered by the help drawer, not this site. Their
# frontmatter (summary, tags) is written for the drawer's topic index, and they
# are not in the nav, so building them only leaks them into the site search.
exclude_docs: |
  help/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    # Language changes must reload the page to refresh localized theme labels.
    - navigation.tracking
    # Top-level groups become tabs across the header instead of one long
    # sidebar. The sidebar then shows only the section you are reading.
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - toc.follow
    - content.tabs.link
    - content.code.copy
    - search.suggest
    - search.highlight
  icon:
    repo: fontawesome/brands/github

nav:
  - Home: README.md
  - About ePT: about-ept.md
  - User guide: user-guide.md
  - Operations:
      - Install: setup.md
      - Update: updating.md
      - Backup & recovery: backup-and-migration.md
      - Infrastructure: infrastructure.md
      - CLI tools: cli-tools.md
      - Repair missing tables: heal-schema.md
      - Troubleshooting: troubleshooting.md
      - User management: user-management.md
      - Storage & retention: data-lifecycle.md
      - Deployment handover: deployment-handover.md
  - System reference:
      - Functional requirements: functional-requirements.md
      - Security & non-functional requirements: security.md
      - Data model & core dictionary: data-model.md
      - Physical columns: physical-schema.md
      - API routes: api-reference.md
      - Software & licenses: software-licenses.md
      - Validation: validation.md
  - Development:
      - Architecture: ARCHITECTURE.md
      - Schemes: SchemeArchitecture.md
      - Admin module: AdminModuleGuide.md
      - Translation: TranslationGuide.md
      - Engineering standards: engineering-standards.md
  - Training:
      - Overview: training/README.md
      - "Part 1: Setup & participants": training/part1-setup-and-participants.md
      - "Part 2: Surveys & shipments": training/part2-surveys-and-shipments.md
      - "Part 3: Participant results": training/part3-participant.md
      - "Part 4: Evaluation & reports": training/part4-evaluation-and-reports.md
      - "Exercise: DTS HIV Serology": training/exercises/dts-hiv-serology.md

plugins:
  - search
  - i18n:
      docs_structure: folder
      fallback_to_default: true
      languages:
        - locale: en
          name: English
          default: true
        - locale: fr
          name: Français
          site_name: Documentation ePT
          site_description: Documentation et formation pour le système ePT d'essais d'aptitude
          nav_translations:
            Home: Accueil
            About ePT: Présentation (anglais)
            User guide: Guide utilisateur
            Operations: Exploitation
            Install: Installation (anglais)
            Update: Mise à jour (anglais)
            Backup & recovery: Sauvegarde et reprise (anglais)
            Infrastructure: Infrastructure (anglais)
            CLI tools: Outils CLI (anglais)
            Repair missing tables: Réparer les tables manquantes (anglais)
            Troubleshooting: Dépannage
            User management: Gestion des utilisateurs
            Storage & retention: Stockage et conservation
            Deployment handover: Remise du déploiement
            System reference: Référentiels
            Functional requirements: Exigences fonctionnelles
            Security & non-functional requirements: Sécurité et exigences non fonctionnelles
            Data model & core dictionary: Modèle de données et dictionnaire
            Physical columns: Colonnes physiques
            API routes: Routes API
            Software & licenses: Logiciels et licences
            Validation: Validation
            Development: Développement (anglais)
            Architecture: Architecture (anglais)
            Schemes: Programmes (anglais)
            Admin module: Module administrateur (anglais)
            Translation: Traduction (anglais)
            Engineering standards: Règles de développement (anglais)
            Training: Formation (anglais)
            Overview: Vue d'ensemble (anglais)
            "Part 1: Setup & participants": "Partie 1 : Configuration et participants (anglais)"
            "Part 2: Surveys & shipments": "Partie 2 : Enquêtes et expéditions (anglais)"
            "Part 3: Participant results": "Partie 3 : Résultats des participants (anglais)"
            "Part 4: Evaluation & reports": "Partie 4 : Évaluation et rapports (anglais)"
            "Exercise: DTS HIV Serology": "Exercice : Sérologie VIH DTS (anglais)"

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  # Right-hand contents lists H2 only. Deeper levels made it a second,
  # competing navigation column.
  - toc:
      permalink: true
      toc_depth: 2
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/deforay/ept
