name: PHP Quality

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: php-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: Hygiene (conflict markers, debug leftovers)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          fetch-depth: 0   # need history to diff against the base ref

      - name: Determine diff base
        id: base
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          zero=0000000000000000000000000000000000000000
          if [ "$EVENT" = "pull_request" ]; then
            ref="$PR_BASE_SHA"
          elif [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != "$zero" ] \
               && git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
            ref="$PUSH_BEFORE"
          else
            # new branch / force push / shallow: fall back to the previous commit
            ref="$(git rev-parse HEAD^ 2>/dev/null || git rev-parse HEAD)"
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "Diffing against: $ref"

      - name: Scan introduced changes
        env:
          BASE_REF: ${{ steps.base.outputs.ref }}
        run: bash bin/ci/hygiene.sh "$BASE_REF" HEAD

  quality:
    name: PHPStan, CS-Fixer, Composer Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PHP_VERSION: '8.4'
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - name: Set up PHP
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc  # v2.37.1
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: gd, zip, pdo, json, curl, gettext, openssl, fileinfo, sodium, zlib, intl, bcmath, mbstring, dom, xml, simplexml, ctype, iconv
          tools: composer:v2
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-dev-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-dev-
            ${{ runner.os }}-composer-

      - name: Install dependencies
        run: |
          composer install \
            --prefer-dist \
            --no-progress \
            --no-interaction

      - name: PHPStan
        run: composer phpstan

      - name: PHP-CS-Fixer (dry-run)
        run: composer cs-check

      - name: Composer Audit
        run: composer audit
