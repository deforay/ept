# SonarQube Cloud automatic analysis settings.
#
# Automatic analysis reads this file (not sonar-project.properties) and only
# honours file-level settings. Rules are chosen in the "ePT Way" quality
# profiles of the deforay organization, not here.

sonar.sources=.
sonar.sourceEncoding=UTF-8

# ---------------------------------------------------------------------------
# Exclusions: code we did not write and will not patch, generated files, SQL
# (released migrations are never edited, and MySQL is checked against PL/SQL
# rules that do not fit it) and dev-only tooling.
# ---------------------------------------------------------------------------
sonar.exclusions=\
    **/*.sql,\
    docs/**,\
    test-harness/**,\
    public/assets/**,\
    **/*.min.js,\
    **/*.min.css,\
    **/*.pkgd.js,\
    public/js/additional-methods.js,\
    public/js/bootstrap*.js,\
    public/js/bootstrap-wysihtml5/**,\
    public/js/cufon-*.js,\
    public/js/daterangepicker.js,\
    public/js/data.js,\
    public/js/DT_bootstrap.js,\
    public/js/export-data.js,\
    public/js/exporting.js,\
    public/js/extra.js,\
    public/js/highchart*.js,\
    public/js/highstock.js,\
    public/js/home.js,\
    public/js/hoverIntent.js,\
    public/js/html5*.js,\
    public/js/ie10-viewport-bug-workaround.js,\
    public/js/jasny-bootstrap.js,\
    public/js/jquery*.js,\
    public/js/looped*.js,\
    public/js/morris*.js,\
    public/js/Myriad_Pro_*.font.js,\
    public/js/respond_*.js,\
    public/js/standingRedraw.js,\
    public/js/superfish.js,\
    public/js/supersubs.js,\
    public/js/toastify-js.js,\
    public/css/bootstrap*.css,\
    public/css/bootstrap-wysihtml5/**,\
    public/css/buttons.css,\
    public/css/css/**,\
    public/css/daterangepicker.css,\
    public/css/DT_bootstrap.css,\
    public/css/editor.css,\
    public/css/font_awesome.css,\
    public/css/formalize.css,\
    public/css/glyphicon.css,\
    public/css/grid.css,\
    public/css/jasny-bootstrap.css,\
    public/css/jquery*.css,\
    public/css/morris-*.css,\
    public/css/multi-select.css,\
    public/css/offline-theme-slide.css,\
    public/css/reset.css,\
    public/css/select2.css,\
    public/css/table.css

# ---------------------------------------------------------------------------
# Duplication is intentional in:
#   - view templates and per-country report layouts / certificate templates
#   - per-test-type models (VL, EID, TB, DTS, Recency, DBS, Covid19, Generic)
#     and the three services that carry parallel per-test-type methods
# These stay in normal analysis so real bugs are still reported.
# ---------------------------------------------------------------------------
sonar.cpd.exclusions=\
    application/**/views/**,\
    scheduled-jobs/report-layouts/**,\
    application/models/**,\
    application/services/Shipments.php,\
    application/services/Reports.php,\
    application/services/Evaluation.php
